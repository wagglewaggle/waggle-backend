name: Build and Develop

on:
  push:
    branches:
      - develop/waggle-1.0.0
  workflow_dispatch:


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Packages build
        run: pnpm run build:package

      - name: Run API App build
        run: pnpm run build:api