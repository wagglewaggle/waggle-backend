name: Manual Parallel Matrix Build

on:
  workflow_dispatch:
    inputs:
      target_apps:
        description: '빌드할 앱 이름을 입력하세요 (쉼표 구분, 예: api, admin). 전체 빌드는 all 입력'
        required: true
        default: 'all'

jobs:
  # [Step 1] 빌드 대상을 결정하고 Matrix 데이터를 생성하는 Job
  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      app_list: ${{ steps.set-matrix.outputs.app_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect and Filter Apps
        id: set-matrix
        run: |
          INPUT_APPS="${{ github.event.inputs.target_apps }}"
          
          # 실제 apps 폴더 하위 프로젝트 감지
          ALL_APPS=$(find apps -maxdepth 1 -type d -not -path apps | sed 's|apps/||' | sort)
          echo "Detected all apps: $ALL_APPS"

          SELECTED_APPS=()
          if [ "$INPUT_APPS" = "all" ]; then
            # 전체 빌드인 경우 감지된 모든 앱 추가
            for app in $ALL_APPS; do
              SELECTED_APPS+=("$app")
            done
          else
            # 쉼표로 입력받은 앱들을 검증 후 추가
            IFS=',' read -ra ADDR <<< "$INPUT_APPS"
            for app in "${ADDR[@]}"; do
              CLEAN_APP=$(echo $app | xargs)
              if echo "$ALL_APPS" | grep -q -w "$CLEAN_APP"; then
                SELECTED_APPS+=("$CLEAN_APP")
              fi
            done
          fi

          # JSON 배열 형태로 변환
          APPS_JSON=$(printf '%s\n' "${SELECTED_APPS[@]}" | jq -R . | jq -s -c .)
          echo "Selected for matrix: $APPS_JSON"
          echo "app_list=$APPS_JSON" >> $GITHUB_OUTPUT

  # [Step 2] 선택된 앱들을 Matrix로 병렬 빌드하는 Job
  build-apps:
    name: Build App (${{ matrix.app }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    if: needs.prepare-matrix.outputs.app_list != '[]'
    strategy:
      fail-fast: false # 하나가 실패해도 다른 앱 빌드는 계속 진행
      matrix:
        app: ${{ fromJson(needs.prepare-matrix.outputs.app_list) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # [조건 5, 6] 각 Matrix Runner에서 독립적으로 사전 작업 수행
      - name: Run Common Packages Build
        run: pnpm run build:package

      - name: Run Target App Build
        run: pnpm --filter ${{ matrix.app }} build